org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# aapt2 指定独立部署副本: 本机在 Android\Sdk 与 .gradle 缓存目录下直接运行 aapt2.exe 时,
# 该进程无法创建任何输出文件(报 "The data is invalid. (13)"), 复制到独立目录即可正常运行。
android.aapt2FromMavenOverride=C:/aapt2test/aapt2.exe
